# ============================================================
# Ptech 平台 - Docker Compose 编排文件
# 用法：
#   docker compose up -d              # 构建并后台启动
#   docker compose up -d --build      # 强制重新构建并启动
#   docker compose ps                 # 查看服务状态
#   docker compose logs -f [service]  # 查看日志
#   docker compose down               # 停止并移除
#   docker compose down -v            # 停止并移除 + 删除数据卷（危险）
# ============================================================

services:
  frontend:
    image: nginx:1.27-alpine
    container_name: site-webui
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../../site-webui/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ${JINYNET_FILE_DIR:-./files}:/data/jinynet/files:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      ptech-network:
        aliases:
          - frontend
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend:
    build:
      context: ../../site-server
      dockerfile: Dockerfile
    image: site-server:latest
    container_name: site-server
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD}
      JAVA_OPTS: >-
        -Xms256m -Xmx512m
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=200
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/app/logs/heapdump.hprof
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      ptech-network:
        aliases:
          - backend
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  postgres:
    image: postgres:16-alpine
    container_name: ptech-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
      PG_SHARED_BUFFERS: 256MB
      PG_EFFECTIVE_CACHE_SIZE: 768MB
      PG_MAINTENANCE_WORK_MEM: 64MB
      PG_WAL_BUFFERS: 16MB
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../design/05-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      ptech-network:
        aliases:
          - postgres
          - db
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: ptech-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - "900 1"
      - --save
      - "300 10"
      - --save
      - "60 10000"
      - --appendonly
      - "yes"
    volumes:
      - redis-data:/data
    networks:
      ptech-network:
        aliases:
          - redis
          - cache
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "30m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    sysctls:
      - net.core.somaxconn=1024

volumes:
  postgres-data:
    name: ptech-postgres-data
    driver: local
  redis-data:
    name: ptech-redis-data
    driver: local

networks:
  ptech-network:
    name: ptech-network
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: ptech-br0
    ipam:
      config:
        - subnet: 172.28.0.0/16
