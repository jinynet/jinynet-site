# ============================================================
# Ptech 平台 - Docker Compose 编排文件
# 用法：
#   docker compose up -d              # 构建并后台启动
#   docker compose up -d --build      # 强制重新构建并启动
#   docker compose ps                 # 查看服务状态
#   docker compose logs -f [service]  # 查看日志
#   docker compose down               # 停止并移除
#   docker compose down -v            # 停止并移除 + 删除数据卷（危险）
# ============================================================

services:
  # ==================== Nginx 前端 ====================
  frontend:
    image: nginx:1.27-alpine
    container_name: site-webui
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 方式一：宿主机已构建 dist（默认）
      - ../../site-webui/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      ptech-network:
        aliases:
          - frontend
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ==================== Spring Boot 后端 ====================
  backend:
    build:
      context: ../../site-server
      dockerfile: Dockerfile
    image: site-server:latest
    container_name: site-server
    ports:
      - "8080:8080"
    environment:
      # Spring
      SPRING_PROFILES_ACTIVE: prod
      # 数据源
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ptech
      SPRING_DATASOURCE_USERNAME: ptech
      SPRING_DATASOURCE_PASSWORD: ptech123456
      # Redis
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: redis123456
      # JVM
      JAVA_OPTS: >-
        -Xms256m -Xmx512m
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=200
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/app/logs/heapdump.hprof
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      ptech-network:
        aliases:
          - backend
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ==================== PostgreSQL 数据库 ====================
  postgres:
    image: postgres:16-alpine
    container_name: ptech-postgres
    environment:
      POSTGRES_DB: ptech
      POSTGRES_USER: ptech
      POSTGRES_PASSWORD: ptech123456
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
      # PG 调优参数
      PG_SHARED_BUFFERS: 256MB
      PG_EFFECTIVE_CACHE_SIZE: 768MB
      PG_MAINTENANCE_WORK_MEM: 64MB
      PG_WAL_BUFFERS: 16MB
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # 初始化脚本（首次启动执行）
      - ../design/05-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5432:5432"
    networks:
      ptech-network:
        aliases:
          - postgres
          - db
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ptech -d ptech"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==================== Redis 缓存 ====================
  redis:
    image: redis:7-alpine
    container_name: ptech-redis
    command:
      - redis-server
      - --requirepass redis123456
      - --maxmemory 256mb
      - --maxmemory-policy allkeys-lru
      - --save 900 1
      - --save 300 10
      - --save 60 10000
      - --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      ptech-network:
        aliases:
          - redis
          - cache
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "30m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "redis123456", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    sysctls:
      - net.core.somaxconn=1024

# ==================== 命名卷 ====================
volumes:
  postgres-data:
    name: ptech-postgres-data
    driver: local
  redis-data:
    name: ptech-redis-data
    driver: local

# ==================== 网络 ====================
networks:
  ptech-network:
    name: ptech-network
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: ptech-br0
    ipam:
      config:
        - subnet: 172.28.0.0/16
