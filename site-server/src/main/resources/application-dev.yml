server:
  port: 8080

jimmer:
  show-sql: true
  pretty-sql: true

dromara:
  x-file-storage:
    local-plus:
      - platform: local-1
        enable-storage: true
        enable-access: true
        domain: http://localhost:8080/file/
        path-patterns: /file/**
        base-path: uploads/
        storage-path: D:/Temp/ptech/
        auto-create-directory: true

jinynet:
  cors:
    enable: true
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
    allowed-methods:
      - OPTIONS
      - GET
      - POST
      - PUT
      - DELETE
    allowed-headers:
      - "*"
    allow-credentials: true
    max-age: 3600
  xss:
    enable: true
  security-headers:
    enable: true
  site:
    url: http://localhost:5173
  email:
    env: dev
    host: ${email.host}
    username: ${email.username}
    password: ${email.password}
    protocol: smtp
    port: 465
    ssl: true
    auth: true
    debug: false
  email-captcha:
    enable: true
    validate: false
    length: 6
    prefix: "email-captcha"
    timeout: 300
    interval: 60
  slider-captcha:
    enable: true
    validate: true
    prefix: "slider-captcha"
    timeout: 180